name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on its default case-insensitive filesystem.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # The completion and Alt-K tests drive a real bash, with
      # bash-completion, and a real zsh; macOS's own bash is too old, so
      # Homebrew's comes first.
      - name: Shells for the completion and Alt-K tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh bash-completion
      - name: Shells for the completion and Alt-K tests (macOS)
        if: runner.os == 'macOS'
        run: brew install bash bash-completion@2
      - name: Schemas match the spec
        run: python3 scripts/extract-schemas.py --check
      - name: Formatted
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -timeout 30m ./...
      # go test hides skips; this shows whether the real shells ran.
      - name: Completion and Alt-K in real shells
        run: go test -v -count=1 -run 'Test(Complete|PickAltK)(Bash|Zsh)$' ./cmd/koan/
